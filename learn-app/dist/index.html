<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDD Learn</title>
  <script type="module" crossorigin src="./assets/index-DJoHXOFr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CEl8AHdo.css">

<body>
<header class="top">
  <div class="top-in">
    <div class="brand">SDD Learn</div>
    <nav class="nav" aria-label="Views"><a href="#lesson" data-nav="lesson">Lesson</a><a href="#interests" data-nav="interests">Interests</a></nav>
